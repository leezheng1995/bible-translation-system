services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bible-api
    ports:
      - "8000:8000"
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=sqlite:///./data/bible_translation.db
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: bible-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bible-celery-worker
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=sqlite:///./data/bible_translation.db
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
    depends_on:
      - redis

volumes:
  redis_data:
