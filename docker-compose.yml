services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bible-api
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./skills:/app/skills:ro
      - ./secrets:/app/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bible-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthcheck').read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: bible-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - bible-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: bible-celery-worker
    command: celery -A app.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./data:/app/data
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./skills:/app/skills:ro
      - ./secrets:/app/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - bible-network

volumes:
  redis_data:

networks:
  bible-network:
    driver: bridge
